name: Bug report
description: Report a problem with Electron Adblock
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include tokens, private data or security-sensitive details; use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Electron Adblock version
      description: From the release tag or the app version in Settings
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: target-app
    attributes:
      label: Target application
      description: Name and version of the Electron app you were trying to filter
    validations:
      required: true
  - type: dropdown
    id: launched
    attributes:
      label: Was the target app launched through Electron Adblock?
      options:
        - Yes, launched/relaunched through Electron Adblock
        - No, it was already running
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the expected behaviour and what you observed instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Electron Adblock
        2. Add application ...
        3. Click Pick element ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Copy the relevant Activity panel entries or console output. Remove private data first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first
          required: true
        - label: This is not a security vulnerability
          required: true